name: Validate screensavers
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every screensaver
        run: python3 -I scripts/validate.py --check
      - name: index.json is up to date
        run: |
          python3 -I scripts/validate.py
          git diff --exit-code -- index.json || { echo "Run scripts/validate.py and commit index.json"; exit 1; }
