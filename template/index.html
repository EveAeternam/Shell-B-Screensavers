<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screensaver</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060c; overflow: hidden; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Screensaver skeleton: a full-window canvas, a clamped-dt loop, resize, a reduced-motion slowdown and a pause while
// hidden. Replace draw() with the piece. Shell:B shows this full screen when the computer is idle.
const cv = document.getElementById('c'), g = cv.getContext('2d');
const slow = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.25 : 1;
let w = 0, h = 0, t = 0, last = performance.now();
function size() {
  const dpr = Math.min(2, devicePixelRatio || 1);
  w = innerWidth; h = innerHeight; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', size); size();

function draw(dt) {
  // a placeholder: three slow, drifting glows
  g.fillStyle = 'rgba(5, 6, 12, 0.2)'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 3; i++) {
    const x = w * (0.5 + 0.35 * Math.sin(t * (0.07 + i * 0.03) + i * 2)), y = h * (0.5 + 0.3 * Math.cos(t * (0.05 + i * 0.02) + i));
    const r = Math.min(w, h) * 0.35, grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, ['#3d7bff33', '#ff3d7f2e', '#ffc23d26'][i]); grd.addColorStop(1, '#0000');
    g.fillStyle = grd; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * slow; last = now; t += dt;
  draw(dt);
  requestAnimationFrame(frame);
}
g.fillStyle = '#05060c'; g.fillRect(0, 0, w, h);
requestAnimationFrame(frame);
</script>
</body>
</html>
