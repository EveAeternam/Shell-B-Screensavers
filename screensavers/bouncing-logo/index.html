<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bouncing Logo</title>
<style>
  html, body { margin: 0; height: 100%; background: #05010d; overflow: hidden; cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Bouncing Logo: Shell:B's tile and wordmark bouncing off the walls. Change WORD to make it yours.
// Tuning
const WORD = 'Shell:B', LETTER = 'B', SPEED_X = 110, SPEED_Y = 80, STAR_COUNT = 120;

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const slow = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0.25 : 1;
let w = 0, h = 0, t = 0, last = performance.now();
function size() {
  const dpr = Math.min(1.5, devicePixelRatio || 1);
  w = innerWidth; h = innerHeight; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', size); size();

const bg = Array.from({ length: STAR_COUNT }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.2 + 0.2, p: Math.random() * Math.PI * 2 }));
let x = Math.random() * 200 + 40, y = Math.random() * 200 + 40, vx = SPEED_X, vy = SPEED_Y, hue = 290, flash = 0;

function draw(dt) {
  ctx.fillStyle = '#05010d'; ctx.fillRect(0, 0, w, h);
  for (const s of bg) {
    ctx.globalAlpha = 0.25 + 0.5 * Math.abs(Math.sin(t * 0.6 + s.p));
    ctx.fillStyle = '#fff'; ctx.fillRect(s.x * w, s.y * h, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  const tile = Math.max(44, Math.min(w, h) * 0.08);
  ctx.font = `700 ${tile * 0.62}px Inter, system-ui, sans-serif`;
  const bw = tile + tile * 0.3 + ctx.measureText(WORD).width, bh = tile;
  x += vx * dt; y += vy * dt;
  let hits = 0;
  if (x < 0) { x = 0; vx = Math.abs(vx); hits++; } else if (x + bw > w) { x = w - bw; vx = -Math.abs(vx); hits++; }
  if (y < 0) { y = 0; vy = Math.abs(vy); hits++; } else if (y + bh > h) { y = h - bh; vy = -Math.abs(vy); hits++; }
  if (hits) hue = (hue + 67) % 360;
  if (hits === 2) flash = 1;  // a perfect corner
  flash = Math.max(0, flash - dt * 0.7);

  const c1 = `hsl(${hue} 90% 62%)`, c2 = `hsl(${(hue + 50) % 360} 90% 70%)`;
  ctx.save();
  ctx.shadowColor = c1; ctx.shadowBlur = 30 + flash * 60;
  const g = ctx.createLinearGradient(x, y, x + tile, y + tile);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, y, tile, tile, tile * 0.22); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(LETTER, x + tile / 2, y + tile * 0.54);
  ctx.textAlign = 'left'; ctx.shadowColor = c1; ctx.shadowBlur = 18; ctx.fillStyle = c2;
  ctx.fillText(WORD, x + tile * 1.3, y + tile * 0.54);
  ctx.restore();
  if (flash) { ctx.fillStyle = `rgba(255,255,255,${flash * 0.15})`; ctx.fillRect(0, 0, w, h); }
}

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000) * slow; last = now; t += dt;
  if (!document.hidden) draw(dt);
  requestAnimationFrame(frame);
}
draw(0);
requestAnimationFrame(frame);
</script>
</body>
</html>
